<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>
    (function () {
      var repo = "/studentERP";
      var location = window.location;

      var path = location.pathname.startsWith(repo)
        ? location.pathname.substring(repo.length)
        : location.pathname;

      var redirect =
        repo +
        "/?/" +
        path.replace(/^\/+/, "") +
        (location.search
          ? "&" + location.search.substring(1)
          : "") +
        location.hash;

      location.replace(redirect);
    })();
  </script>
</head>

<body>
</body>
</html>
